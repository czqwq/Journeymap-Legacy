name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    # Publishing test results (commit status, PR comment) needs statuses and pull-requests write
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    with:
      timeout: 180
      # Optional inputs (defaults shown):
      # workspace: setupDecompWorkspace
      # client-only: false
      # disable-server-auto-stop: false
      # disable-spotless-pr: false
      # disable-test-comment: false
      # horizonqa: true
      # horizonqa-tests: ''
      # horizonqa-allow-no-tests: false
      # external-deps-inclusion: true
      # java-distribution: temurin
      # cache-rfg: true
    secrets: inherit
